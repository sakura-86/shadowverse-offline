[pytest]
testpaths = decision_engine/tests
markers =
    slow: CLI integration tests and heavy I/O (subprocess + template reload)
    core: Core logic unit tests (rule kernel, enumerator, predictor, effects)

# 默认只跑 core 测试（快速验证 ~5s）
# 全量测试用: pytest -m "" 或 pytest --run-all
addopts = -m "not slow" -q --tb=short
