[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowverse-offline"
version = "0.1.0"
description = "Offline subset of a card-battle AI: local rule engine, PUCT search, PPO self-play."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
]

[tool.setuptools.packages.find]
include = ["decision_engine*"]

[tool.pytest.ini_options]
testpaths = ["decision_engine/tests"]
